backend:
  name: github
  repo: quykhanh1603/pip24h
  branch: master
  base_url: https://pip24h-cms-auth.quykhanh1603-haiduong.workers.dev
  auth_endpoint: auth

media_folder: "public/images/brokers"
public_folder: "/images/brokers"

collections:
  - name: "brokers_ja"
    label: "ブローカー（日本語）"
    folder: "src/content/brokers/ja"
    create: true
    slug: "{{slug}}"
    media_folder: "../../../../public/images/brokers/{{slug}}"
    public_folder: "/images/brokers/{{slug}}"
    fields:
      - { label: "ブローカー名", name: "name", widget: "string" }
      - { label: "ロゴ", name: "logo", widget: "image" }
      - { label: "取扱商品", name: "assetType", widget: "select", options: ["forex", "crypto", "both"] }
      - { label: "評価（0-5）", name: "rating", widget: "number", min: 0, max: 5, step: 0.1 }
      - { label: "概要", name: "summary", widget: "text" }
      - { label: "設立年", name: "foundedYear", widget: "number", required: false }
      - { label: "最低入金額", name: "minDeposit", widget: "string", required: false }
      - { label: "最小スプレッド", name: "spreadFrom", widget: "string", required: false }
      - { label: "最大レバレッジ", name: "maxLeverage", widget: "string", required: false, hint: "例: 1:2000" }
      - { label: "即時出金", name: "instantWithdrawal", widget: "boolean", default: false }
      - { label: "金融ライセンス", name: "regulation", widget: "list", default: [] }
      - { label: "取引プラットフォーム", name: "platforms", widget: "list", default: [] }
      - { label: "メリット", name: "pros", widget: "list", default: [] }
      - { label: "デメリット", name: "cons", widget: "list", default: [] }
      - {
          label: "おすすめの用途",
          name: "category",
          widget: "select",
          multiple: true,
          default: [],
          options:
            [
              { label: "スキャルピング", value: "scalping" },
              { label: "初心者向け", value: "beginners" },
              { label: "ECN/Raw", value: "ecn" },
              { label: "低額入金", value: "low-deposit" },
            ],
        }
      - { label: "バッジ", name: "badge", widget: "string", required: false, hint: '例: "総合No.1"' }
      - { label: "アフィリエイトリンク", name: "affiliateUrl", widget: "string", default: "AFF_LINK_PLACEHOLDER" }
      - { label: "注目（featured）", name: "featured", widget: "boolean", default: false }
      - { label: "更新日", name: "updatedDate", widget: "datetime" }
      - { label: "本文", name: "body", widget: "markdown" }

  - name: "brokers_en"
    label: "Broker (English)"
    folder: "src/content/brokers/en"
    create: true
    slug: "{{slug}}"
    media_folder: "../../../../public/images/brokers/{{slug}}"
    public_folder: "/images/brokers/{{slug}}"
    fields:
      - { label: "Broker name", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      - { label: "Asset type", name: "assetType", widget: "select", options: ["forex", "crypto", "both"] }
      - { label: "Rating (0-5)", name: "rating", widget: "number", min: 0, max: 5, step: 0.1 }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Founded year", name: "foundedYear", widget: "number", required: false }
      - { label: "Min deposit", name: "minDeposit", widget: "string", required: false }
      - { label: "Spread from", name: "spreadFrom", widget: "string", required: false }
      - { label: "Max leverage", name: "maxLeverage", widget: "string", required: false, hint: "e.g. 1:2000" }
      - { label: "Instant withdrawal", name: "instantWithdrawal", widget: "boolean", default: false }
      - { label: "Regulated by", name: "regulation", widget: "list", default: [] }
      - { label: "Trading platforms", name: "platforms", widget: "list", default: [] }
      - { label: "Pros", name: "pros", widget: "list", default: [] }
      - { label: "Cons", name: "cons", widget: "list", default: [] }
      - {
          label: "Best for",
          name: "category",
          widget: "select",
          multiple: true,
          default: [],
          options:
            [
              { label: "Scalping", value: "scalping" },
              { label: "Beginners", value: "beginners" },
              { label: "ECN/Raw", value: "ecn" },
              { label: "Low Deposit", value: "low-deposit" },
            ],
        }
      - { label: "Badge", name: "badge", widget: "string", required: false, hint: 'e.g. "Best Overall"' }
      - { label: "Affiliate link", name: "affiliateUrl", widget: "string", default: "AFF_LINK_PLACEHOLDER" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Updated date", name: "updatedDate", widget: "datetime" }
      - { label: "Body content", name: "body", widget: "markdown" }

  - name: "guides_ja"
    label: "ガイド（日本語）"
    folder: "src/content/guides/ja"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "概要", name: "summary", widget: "text", hint: "一覧カードに表示される1〜2文の説明" }
      - {
          label: "カテゴリー",
          name: "category",
          widget: "select",
          options:
            [
              { label: "基礎知識", value: "basics" },
              { label: "リスク管理", value: "risk-management" },
              { label: "テクニカル分析", value: "technical-analysis" },
              { label: "チャートパターン", value: "chart-patterns" },
              { label: "トレード心理", value: "psychology" },
              { label: "ファンダメンタルズ分析", value: "fundamentals" },
            ],
        }
      - { label: "更新日", name: "updatedDate", widget: "datetime" }
      - { label: "本文", name: "body", widget: "markdown" }

  - name: "guides_en"
    label: "Guides (English)"
    folder: "src/content/guides/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text", hint: "1-2 sentences shown on the listing card" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            [
              { label: "Basics", value: "basics" },
              { label: "Risk Management", value: "risk-management" },
              { label: "Technical Analysis", value: "technical-analysis" },
              { label: "Chart Patterns", value: "chart-patterns" },
              { label: "Psychology", value: "psychology" },
              { label: "Fundamentals", value: "fundamentals" },
            ],
        }
      - { label: "Updated date", name: "updatedDate", widget: "datetime" }
      - { label: "Body content", name: "body", widget: "markdown" }

  - name: "propfirms_ja"
    label: "プロップファーム（日本語）"
    folder: "src/content/propfirms/ja"
    create: true
    slug: "{{slug}}"
    media_folder: "../../../../public/images/propfirms/{{slug}}"
    public_folder: "/images/propfirms/{{slug}}"
    fields:
      - { label: "ファーム名", name: "name", widget: "string" }
      - { label: "ロゴ", name: "logo", widget: "image" }
      - { label: "Market", name: "market", widget: "select", options: ["forex-cfd", "futures"], default: "forex-cfd" }
      - { label: "評価（0-5）", name: "rating", widget: "number", min: 0, max: 5, step: 0.1 }
      - { label: "概要", name: "summary", widget: "text" }
      - { label: "バッジ", name: "badge", widget: "string", required: false }
      - { label: "設立年", name: "foundedYear", widget: "number", required: false }
      - { label: "本社", name: "headquarters", widget: "string", required: false }
      - { label: "口座サイズ", name: "accountSizes", widget: "string", hint: "$10K – $200K" }
      - { label: "最大資金", name: "maxFunding", widget: "string", required: false }
      - { label: "スケーリング上限", name: "scalingUpTo", widget: "string", required: false }
      - { label: "参加費（最安）", name: "feeFrom", widget: "string" }
      - { label: "利益配分", name: "profitSplit", widget: "string" }
      - { label: "報酬の支払い", name: "payoutFrequency", widget: "string", required: false }
      - { label: "プラットフォーム", name: "platforms", widget: "list", default: [] }
      - { label: "指標発表時の取引", name: "newsTrading", widget: "select", options: ["allowed", "restricted", "not-allowed"], default: "allowed" }
      - { label: "週末の持ち越し", name: "weekendHolding", widget: "select", options: ["allowed", "restricted", "not-allowed"], default: "allowed" }
      - { label: "EA", name: "eaAllowed", widget: "boolean", default: true }
      - { label: "Trustpilot", name: "trustpilotScore", widget: "number", required: false, min: 0, max: 5, step: 0.1 }
      - label: "評価プログラム"
        name: "programs"
        widget: "list"
        fields:
          - { label: "プログラム名", name: "name", widget: "string" }
          - { label: "Type", name: "type", widget: "select", options: ["1-step", "2-step", "3-step", "instant"] }
          - { label: "利益目標（段階ごと%）", name: "profitTargets", widget: "list", field: { label: "%", name: "target", widget: "number", value_type: "float" } }
          - { label: "1日の損失上限（%）", name: "maxDailyLoss", widget: "number", required: false, value_type: "float" }
          - { label: "最大損失（%）", name: "maxLoss", widget: "number", value_type: "float" }
          - { label: "最大損失の方式", name: "maxLossType", widget: "select", options: ["static", "trailing"] }
          - { label: "最低取引日数", name: "minTradingDays", widget: "number", default: 0 }
          - { label: "利益配分", name: "profitSplit", widget: "string" }
          - { label: "参加費の返金", name: "feeRefundable", widget: "boolean", default: false }
          - { label: "補足", name: "note", widget: "string", required: false }
      - { label: "メリット", name: "pros", widget: "list", default: [] }
      - { label: "デメリット", name: "cons", widget: "list", default: [] }
      - { label: "アフィリエイトリンク", name: "affiliateUrl", widget: "string", default: "AFF_LINK_PLACEHOLDER" }
      - { label: "注目（featured）", name: "featured", widget: "boolean", default: false }
      - { label: "更新日", name: "updatedDate", widget: "datetime" }
      - { label: "本文", name: "body", widget: "markdown" }

  - name: "propfirms_en"
    label: "Prop Firms (English)"
    folder: "src/content/propfirms/en"
    create: true
    slug: "{{slug}}"
    media_folder: "../../../../public/images/propfirms/{{slug}}"
    public_folder: "/images/propfirms/{{slug}}"
    fields:
      - { label: "Firm name", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      - { label: "Market", name: "market", widget: "select", options: ["forex-cfd", "futures"], default: "forex-cfd" }
      - { label: "Rating (0-5)", name: "rating", widget: "number", min: 0, max: 5, step: 0.1 }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Badge", name: "badge", widget: "string", required: false }
      - { label: "Founded year", name: "foundedYear", widget: "number", required: false }
      - { label: "Headquarters", name: "headquarters", widget: "string", required: false }
      - { label: "Account sizes", name: "accountSizes", widget: "string", hint: "$10K – $200K" }
      - { label: "Max funding", name: "maxFunding", widget: "string", required: false }
      - { label: "Scaling up to", name: "scalingUpTo", widget: "string", required: false }
      - { label: "Fee from", name: "feeFrom", widget: "string" }
      - { label: "Profit split", name: "profitSplit", widget: "string" }
      - { label: "Payout frequency", name: "payoutFrequency", widget: "string", required: false }
      - { label: "Platforms", name: "platforms", widget: "list", default: [] }
      - { label: "News trading", name: "newsTrading", widget: "select", options: ["allowed", "restricted", "not-allowed"], default: "allowed" }
      - { label: "Weekend holding", name: "weekendHolding", widget: "select", options: ["allowed", "restricted", "not-allowed"], default: "allowed" }
      - { label: "EA", name: "eaAllowed", widget: "boolean", default: true }
      - { label: "Trustpilot", name: "trustpilotScore", widget: "number", required: false, min: 0, max: 5, step: 0.1 }
      - label: "Evaluation programs"
        name: "programs"
        widget: "list"
        fields:
          - { label: "Program name", name: "name", widget: "string" }
          - { label: "Type", name: "type", widget: "select", options: ["1-step", "2-step", "3-step", "instant"] }
          - { label: "Profit targets (% per phase)", name: "profitTargets", widget: "list", field: { label: "%", name: "target", widget: "number", value_type: "float" } }
          - { label: "Max daily loss (%)", name: "maxDailyLoss", widget: "number", required: false, value_type: "float" }
          - { label: "Max loss (%)", name: "maxLoss", widget: "number", value_type: "float" }
          - { label: "Max loss type", name: "maxLossType", widget: "select", options: ["static", "trailing"] }
          - { label: "Min trading days", name: "minTradingDays", widget: "number", default: 0 }
          - { label: "Profit split", name: "profitSplit", widget: "string" }
          - { label: "Fee refundable", name: "feeRefundable", widget: "boolean", default: false }
          - { label: "Note", name: "note", widget: "string", required: false }
      - { label: "Pros", name: "pros", widget: "list", default: [] }
      - { label: "Cons", name: "cons", widget: "list", default: [] }
      - { label: "Affiliate link", name: "affiliateUrl", widget: "string", default: "AFF_LINK_PLACEHOLDER" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Updated date", name: "updatedDate", widget: "datetime" }
      - { label: "Body content", name: "body", widget: "markdown" }
